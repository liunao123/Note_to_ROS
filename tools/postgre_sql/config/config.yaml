  # output_folder: /data/postgresql/export/hd_map/


















# ===================================================================
# 源路径管理配置 (05_manage_source_paths.py)
# ===================================================================
source_path_management:
  default_root: jmsroot@192.168.2.78:/data/dwm_raw_data
  path_template: "{default_root}/{session_name}"  # 路径模板



# ===================================================================
# 日志配置
# ===================================================================
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  date_format: '%Y-%m-%d %H:%M:%S'
